<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 316" width="270" height="316" role="img" aria-label="Doraemon">
  <style>
    .float{animation:float 3.4s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .wave{transform-box:view-box;transform-origin:176px 200px;animation:wave 1.3s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(18deg)}}
    .bell{transform-box:view-box;transform-origin:130px 178px;animation:bell 2.6s ease-in-out infinite}
    @keyframes bell{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
    @media (prefers-reduced-motion:reduce){.float,.wave,.bell,.eye{animation:none}}
  </style>
  <g class="float" fill="none" stroke="#1a1a1a" stroke-width="3.4" stroke-linecap="round">
    <ellipse cx="102" cy="291" rx="28" ry="14" fill="#ffffff"/>
    <ellipse cx="158" cy="291" rx="28" ry="14" fill="#ffffff"/>
    <path d="M86 206 L50 224" stroke-width="26"/>
    <path d="M86 206 L50 224" stroke="#00a0e9" stroke-width="20"/>
    <circle cx="42" cy="229" r="15" fill="#ffffff"/>
    <g class="wave">
      <path d="M176 200 L214 166" stroke-width="26"/>
      <path d="M176 200 L214 166" stroke="#00a0e9" stroke-width="20"/>
      <circle cx="220" cy="159" r="15" fill="#ffffff"/>
    </g>
    <rect x="80" y="178" width="100" height="102" rx="46" fill="#00a0e9"/>
    <circle cx="130" cy="238" r="38" fill="#ffffff"/>
    <path d="M106 236 A 24 24 0 0 0 154 236"/>
    <circle cx="130" cy="100" r="88" fill="#00a0e9"/>
    <ellipse cx="130" cy="112" rx="71" ry="72" fill="#ffffff"/>
    <g class="eye">
      <ellipse cx="108" cy="62" rx="22" ry="26" fill="#ffffff"/>
      <ellipse cx="116" cy="70" rx="5.5" ry="7.5" fill="#1a1a1a" stroke="none"/>
    </g>
    <g class="eye">
      <ellipse cx="152" cy="62" rx="22" ry="26" fill="#ffffff"/>
      <ellipse cx="144" cy="70" rx="5.5" ry="7.5" fill="#1a1a1a" stroke="none"/>
    </g>
    <path d="M82 96 L52 86"/>
    <path d="M80 110 L48 110"/>
    <path d="M82 124 L52 134"/>
    <path d="M178 96 L208 86"/>
    <path d="M180 110 L212 110"/>
    <path d="M178 124 L208 134"/>
    <circle cx="130" cy="98" r="13" fill="#e60012"/>
    <circle cx="126" cy="94" r="3.8" fill="#ffffff" stroke="none"/>
    <path d="M130 111 V158"/>
    <path d="M70 118 Q130 196 190 118"/>
    <rect x="74" y="176" width="112" height="16" rx="8" fill="#e60012"/>
    <g class="bell">
      <circle cx="130" cy="204" r="17" fill="#ffc800"/>
      <path d="M115 199 H145"/>
      <circle cx="130" cy="207" r="3.8" fill="#1a1a1a" stroke="none"/>
      <path d="M130 211 V219"/>
    </g>
  </g>
</svg>
